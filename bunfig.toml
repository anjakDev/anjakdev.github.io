[build]
target = "browser"
entrypoints = ["./index.html"]
root = "."
publicPath = "/"

[build.minify]
whitespace = true
identifiers = true
syntax = true

[define]
"process.env.NODE_ENV" = "\"production\""

[serve.static]
plugins = ["bun-plugin-tailwind"]
[install]
# bun-plugin-tailwind lists `bun` as a peer dependency; auto-installing it puts an older Bun in
# node_modules/.bin, which `bun run` then prefers over the version pinned in CI.
peer = false
